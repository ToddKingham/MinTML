<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }
    
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        form {
            width: 250px;
            margin: 50px;
        }
        label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        form > footer {
            display: flex;
            justify-content: flex-end;
            align-items:last baseline;
        }

        input {
            padding: 4px;
        }

        button {
            padding: 5px 20px;
            border: 1px solid gray;
            border-radius: 5px;
            background-color: rgb(105, 150, 82);
            margin-left: 10px;
            cursor: pointer;
        }

        #forgotpw {
            font-size: small;
        }

        #story {
            border: 5px dashed gray;
            width: 50%;
            height: 250px;
            border-radius: 50px;
            padding: 10px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            text-align: center;
        }

        #story span {
            text-decoration: dotted;
            border-bottom: 2px dashed gray;
            font-weight: bold;
            color:cadetblue
        }
    </style>

    <script type="module">
        import MinTML from './mintml.min.js';
        const app = new MinTML();


        app.before("showStory", ({payload})=>{
            // validate form
            if(Object.values(payload).filter(value=>value.trim() === '').length){
                alert("All fields are required");
                return false;
            }

            // display the template
            document.getElementById("story").innerHTML = app.render("storyTemplate", payload);

            // don't send the form anywhere
            return false;

        });
    </script>
</head>
<body>

    <form action="#dashboard" data-before="showStory">
        
        <label>
            Noun:
            <input type="text" name="noun" value="Balloon">
        </label>
        <label>
            Adjective:
            <input type="text" name="adjective" value="Furry">
        </label>
        <label>
            Name:
            <input type="text" name="name" value="John">
        </label>
        <footer>
            <button>Show Template!</button>
        </footer>
    </form>

    <section id="story">
        <template id="storyTemplate">
             <p>One day, <span>{{name}}</span> found a <span>{{adjective}}</span> <span>{{noun}}</span> hiding behind the old barn.
            Excited, <span>{{name}}</span> picked up the <span>{{noun}}</span> and discovered it contained a mysterious map.
            Without hesitation, <span>{{name}}</span> followed the map toward an adventure that would change everything.</p>
        </template>
    </section>

</body>
</html>
