<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinTML Sample App</title>

    <style>
        header {
            height: 5rem;
            background-color: lightblue;
            display: flex;
            justify-content: flex-end;
            gap: .8em;
        }

        header > nav {
            margin: 1em;
        }

        header > nav > a {
            margin-left: 1em;
        }

        section[data-page=active]{
            display: flex;
            flex-direction: column;
            margin: 1em;
        }

        #template_holder {
            border: 5px dashed darkgray;
            width: 200px;
            height: 200px;
            border-radius: 20px;
            margin: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
   
    <script type="module">
       import MinTML from './mintml.js';
       const app = new MinTML();

        app.before("doLogin", (obj)=>{
            console.log(obj);
            // console.log(payload);

            // document.getElementById('template_holder').innerHTML = app.render('foo', {name: payload.user});

            return false;
        });


    </script>

</head>

<body>

    <header>
        <nav>
            <a href="#home?user=Joe" data-before="doLogin">Home</a>
            <a href="#about">About Us</a>
            <a href="#contact">Contact Us</a>
            <a href="#login">Log Out</a>
        </nav>
    </header>

    <main>
        <section id="login">
            <h1>Login Screen</h1>
            <form action="#home" data-before="doLogin">
                <label>
                    User Name:
                    <input type="text" name="user">
                </label>
                
                
                <button>Submit</button>
            </form>

            <h2>Place Template here</h2>
            <div id="template_holder">
                <template id="foo">
                    <div>Hello, {{name}}!</div>
                </template>
            </div>

        </section>

        <section id="home">home</section>
        
        <section id="about">about</section>
        
        <section id="contact">contact</section>
    </main>

    
    
</body>
</html>
